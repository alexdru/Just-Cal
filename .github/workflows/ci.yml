name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # API 37 is published with a minor version in the SDK package path.
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify release tooling
        run: |
          bash scripts/test-release-environment.sh
          bash scripts/test-release-ref.sh
          bash scripts/test-release-validation.sh
          bash scripts/test-release-publication.sh
      - name: Test, lint and assemble debug
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
          bash scripts/test-aab-signature.sh
      - name: Name debug artifact
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: artifact
        run: |
          version=""
          while IFS='=' read -r key value; do
            [[ "$key" != versionName ]] || version="$value"
          done < version.properties
          [[ -n "$version" ]]
          printf 'name=Just-Cal-debug-v%s-%s\n' "$version" "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Upload debug APK
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
